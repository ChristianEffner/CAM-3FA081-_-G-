<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>HausFix - Reading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap / Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/pages.css"/>

    <style>
        .fixed-table{table-layout:fixed;width:100%}
        .fixed-table thead th:nth-child(1){width:15%}
        .fixed-table thead th:nth-child(2){width:15%}
        .fixed-table thead th:nth-child(3){width:20%}
        .fixed-table thead th:nth-child(4){width:15%}
        .fixed-table thead th:nth-child(5){width:10%}
        .fixed-table thead th:nth-child(6){width:25%}
        .short-id-col{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .short-id-col[data-bs-toggle="tooltip"]{cursor:help;text-decoration:underline dotted}
    </style>
</head>
<body>
<div id="sidebar">
    <h2>HausFix</h2>
    <ul class="nav">
        <li class="nav-item"><a href="dashboard.html"    class="nav-link"><i class="fas fa-home"></i> Startseite</a></li>
        <li class="nav-item"><a href="customers.html"    class="nav-link"><i class="fas fa-users"></i> Kunden</a></li>
        <li class="nav-item"><a href="reading.html"      class="nav-link active"><i class="fas fa-book"></i> Reading</a></li>
        <li class="nav-item"><a href="importexport.html" class="nav-link"><i class="fas fa-file-import"></i> Import/Export</a></li>
        <li class="nav-item"><a href="logout.html"       class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div id="content">
    <header>
        <h1>Ablesungsverwaltung</h1>
        <p>Übersicht und Verwaltung aller Ablesungen.</p>
    </header>

    <!-- Kopfzeile: Schnellsuche + Modal-Button -->
    <section>
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-4">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReadingModal">
                <i class="fas fa-plus"></i> Neue Ablesung hinzufügen
            </button>

            <div class="input-group w-auto">
                <input id="quickSearch" class="form-control" placeholder="Schnellsuche (Typ / ID / Name)…">
                <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#advFilterModal">
                    Filter erweitern
                </button>
            </div>
        </div>

        <!-- Tabelle -->
        <div class="table-responsive">
            <table id="readingTable" class="table table-striped table-hover fixed-table">
                <thead class="bg-primary text-white">
                <tr>
                    <th class="short-id-col">ID</th>
                    <th>Kunde</th>
                    <th>Zählertyp</th>
                    <th>Datum</th>
                    <th>Zählerstand</th>
                    <th>Aktionen</th>
                </tr>
                </thead>
                <tbody id="readingTableBody"><!-- gefüllt durch reading.js --></tbody>
            </table>
        </div>
    </section>

    <!-- Modal: Erweiterter Filter -->
    <div class="modal fade" id="advFilterModal" tabindex="-1" aria-labelledby="advFilterLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form id="advFilterForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="advFilterLabel">Erweiterter Filter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Zählertyp</label>
                        <select id="fKind" class="form-select">
                            <option value="">Alle</option>
                            <option value="STROM">STROM</option>
                            <option value="WASSER">WASSER</option>
                            <option value="HEIZUNG">HEIZUNG</option>
                            <option value="UNBEKANNT">UNBEKANNT</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col mb-3">
                            <label class="form-label">Von</label>
                            <input id="fStart" type="date" class="form-control">
                        </div>
                        <div class="col mb-3">
                            <label class="form-label">Bis</label>
                            <input id="fEnd" type="date" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col mb-3">
                            <label class="form-label">Vorname</label>
                            <input id="fFirst" type="text" class="form-control">
                        </div>
                        <div class="col mb-3">
                            <label class="form-label">Nachname</label>
                            <input id="fLast" type="text" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button id="resetFilter" type="button" class="btn btn-outline-secondary">Zurücksetzen</button>
                    <button id="applyFilter" type="submit" class="btn btn-primary">Anwenden</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Ablesung bearbeiten -->
    <div class="modal fade" id="editReadingModal" tabindex="-1" aria-labelledby="editReadingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editReadingModalLabel">Ablesung bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <form id="editReadingForm">
                        <input type="hidden" id="editReadingId"/>
                        <div class="mb-3">
                            <label for="editKindOfMeter" class="form-label">Zählertyp</label>
                            <select id="editKindOfMeter" class="form-control" required>
                                <option value="">-- Bitte auswählen --</option>
                                <option value="STROM">STROM</option>
                                <option value="WASSER">WASSER</option>
                                <option value="HEIZUNG">HEIZUNG</option>
                                <option value="UNBEKANNT">UNBEKANNT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editMeterCount" class="form-label">Zählerstand</label>
                            <input type="number" id="editMeterCount" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="editDateOfReading" class="form-label">Datum</label>
                            <input type="date" id="editDateOfReading" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="editComment" class="form-label">Kommentar</label>
                            <textarea id="editComment" class="form-control"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" id="updateReadingBtn">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Ablesung hinzufügen -->
    <div class="modal fade" id="addReadingModal" tabindex="-1" aria-labelledby="addReadingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addReadingModalLabel">Neue Ablesung</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <form id="addReadingForm">
                        <h6>Kunde (bestehender oder neu)</h6>
                        <div class="mb-3">
                            <select id="customerSelect" class="form-control"><option value="">-- Neuer Kunde --</option></select>
                        </div>

                        <div id="newCustomerFields">
                            <div class="mb-3"><label for="customerId" class="form-label">Kunden-ID (optional)</label><input id="customerId" class="form-control"/></div>
                            <div class="mb-3"><label for="customerFirstName" class="form-label">Vorname</label><input id="customerFirstName" class="form-control"/></div>
                            <div class="mb-3"><label for="customerLastName" class="form-label">Nachname</label><input id="customerLastName" class="form-control"/></div>
                            <div class="mb-3"><label for="customerBirthDate" class="form-label">Geburtsdatum</label><input type="date" id="customerBirthDate" class="form-control"/></div>
                            <div class="mb-3">
                                <label for="customerGender" class="form-label">Geschlecht</label>
                                <select id="customerGender" class="form-control">
                                    <option value="M">Männlich</option><option value="W">Weiblich</option><option value="D">Divers</option>
                                </select>
                            </div>
                        </div>

                        <hr/>

                        <div class="mb-3"><label for="dateOfReading" class="form-label">Datum</label><input type="date" id="dateOfReading" class="form-control" required/></div>
                        <div class="mb-3">
                            <label for="kindOfMeter" class="form-label">Zählertyp</label>
                            <select id="kindOfMeter" class="form-control" required>
                                <option value="">-- Bitte auswählen --</option>
                                <option value="STROM">STROM</option><option value="WASSER">WASSER</option>
                                <option value="HEIZUNG">HEIZUNG</option><option value="UNBEKANNT">UNBEKANNT</option>
                            </select>
                        </div>
                        <div class="mb-3"><label for="meterCount" class="form-label">Zählerstand</label><input type="number" id="meterCount" class="form-control" required/></div>
                        <div class="mb-3"><label for="meterId" class="form-label">Zähler-ID</label><input id="meterId" class="form-control" readonly/></div>
                        <div class="mb-3"><label for="substitute" class="form-label">Substitute</label><input id="substitute" class="form-control" value="0"/></div>
                        <div class="mb-3"><label for="comment" class="form-label">Kommentar</label><textarea id="comment" class="form-control"></textarea></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" id="saveReadingBtn">Speichern</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/reading.js"></script>
<script src="../js/pages.js"></script>

<!-- Tooltip / ID-Kürzen (MutationObserver – unverändert) -->
<script>
    (function(){
      const tbody=document.getElementById("readingTableBody");
      function processRows(){
        tbody.querySelectorAll("tr").forEach(row=>{
          const cells=row.querySelectorAll("td"); if(cells.length<5) return;
          const idCell=cells[0]; const full=idCell.textContent.trim();
          if(full.length>8){
            idCell.textContent=full.substring(0,8);
            idCell.setAttribute("data-bs-toggle","tooltip");
            idCell.setAttribute("data-bs-placement","top");
            idCell.setAttribute("data-bs-title",full);
          }
          const dateCell=cells[2]; const iso=dateCell.textContent.trim();
          if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
            const [y,m,d]=iso.split("-"); dateCell.textContent=`${d}.${m}.${y}`;
          }
        });
        [...tbody.querySelectorAll('[data-bs-toggle="tooltip"]')].forEach(el=>new bootstrap.Tooltip(el));
      }
      new MutationObserver(processRows).observe(tbody,{childList:true,subtree:true});
    })();
</script>
</body>
</html>
