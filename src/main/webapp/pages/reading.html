<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>HausFix - Reading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/pages.css" />

    <!-- Inline-Style für gekürzte ID-Spalte -->
    <style>
        .short-id-col {
          max-width: 150px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div id="sidebar">
    <h2>HausFix</h2>
    <ul class="nav">
        <li class="nav-item">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Startseite</a>
        </li>
        <li class="nav-item">
            <a href="customers.html" class="nav-link"><i class="fas fa-users"></i> Kunden</a>
        </li>
        <li class="nav-item">
            <a href="reading.html" class="nav-link active"><i class="fas fa-book"></i> Reading</a>
        </li>
        <li class="nav-item">
            <a href="importexport.html" class="nav-link"><i class="fas fa-file-import"></i> Import/Export</a>
        </li>
        <li class="nav-item">
            <a href="logout.html" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </li>
    </ul>
</div>

<!-- Content -->
<div id="content">
    <header>
        <h1>Ablesungsverwaltung</h1>
        <p>Übersicht und Verwaltung aller Ablesungen.</p>
    </header>

    <section>
        <div class="d-flex justify-content-between mb-4">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReadingModal">
                <i class="fas fa-plus"></i> Neue Ablesung hinzufügen
            </button>

            <!-- Einfache Filter-/Suchleiste -->
            <div class="input-group w-50">
                <input
                        type="text"
                        id="filterKindOfMeter"
                        class="form-control"
                        placeholder="Nach Typ oder ID suchen..."
                />
                <button class="btn btn-secondary" id="filterButton">Filter anwenden</button>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead class="bg-primary text-white">
            <tr>
                <th class="short-id-col">ID</th>
                <th>Kunde</th>
                <th>Datum</th>
                <th>Zählertyp</th>
                <th>Zählerstand</th>
                <th>Aktionen</th>
            </tr>
            </thead>
            <tbody id="readingTableBody">
            <!-- Dynamisch befüllte Inhalte -->
            <!-- ID kommt hierhin, also <td class="short-id-col" title="..."></td> -->
            </tbody>
        </table>
    </section>

    <!-- Modal: Ablesung bearbeiten -->
    <div class="modal fade" id="editReadingModal" tabindex="-1" aria-labelledby="editReadingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editReadingModalLabel">Ablesung bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <form id="editReadingForm">
                        <!-- Hidden: Reading ID -->
                        <input type="hidden" id="editReadingId" />
                        <div class="mb-3">
                            <label for="editKindOfMeter" class="form-label">Zählertyp</label>
                            <select id="editKindOfMeter" class="form-control" required>
                                <option value="">-- Bitte auswählen --</option>
                                <option value="STROM">STROM</option>
                                <option value="WASSER">WASSER</option>
                                <option value="HEIZUNG">HEIZUNG</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editMeterCount" class="form-label">Zählerstand</label>
                            <input type="number" id="editMeterCount" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editDateOfReading" class="form-label">Datum</label>
                            <input type="date" id="editDateOfReading" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editComment" class="form-label">Kommentar</label>
                            <textarea id="editComment" class="form-control"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" id="updateReadingBtn">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Neue Ablesung hinzufügen -->
    <div class="modal fade" id="addReadingModal" tabindex="-1" aria-labelledby="addReadingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addReadingModalLabel">Neue Ablesung</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <form id="addReadingForm">
                        <!-- Kunde -->
                        <h6>Kunde</h6>
                        <div class="mb-3">
                            <select id="customerSelect" class="form-control">
                                <option value="">-- Neuer Kunde --</option>
                                <!-- Dynamisch befüllt via JS -->
                            </select>
                        </div>

                        <!-- Neue-Kunde-Felder -->
                        <div id="newCustomerFields">
                            <div class="mb-3">
                                <label for="customerId" class="form-label">Kunden-ID (optional)</label>
                                <input type="text" id="customerId" class="form-control" />
                            </div>
                            <div class="mb-3">
                                <label for="customerFirstName" class="form-label">Vorname</label>
                                <input type="text" id="customerFirstName" class="form-control" />
                            </div>
                            <div class="mb-3">
                                <label for="customerLastName" class="form-label">Nachname</label>
                                <input type="text" id="customerLastName" class="form-control" />
                            </div>
                            <div class="mb-3">
                                <label for="customerBirthDate" class="form-label">Geburtsdatum</label>
                                <input type="date" id="customerBirthDate" class="form-control" />
                            </div>
                            <div class="mb-3">
                                <label for="customerGender" class="form-label">Geschlecht</label>
                                <select id="customerGender" class="form-control">
                                    <option value="M">Männlich</option>
                                    <option value="W">Weiblich</option>
                                    <option value="D">Divers</option>
                                </select>
                            </div>
                        </div>

                        <hr />

                        <!-- Ablesungsdaten -->
                        <div class="mb-3">
                            <label for="dateOfReading" class="form-label">Datum</label>
                            <input type="date" id="dateOfReading" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="kindOfMeter" class="form-label">Zählertyp</label>
                            <select id="kindOfMeter" class="form-control" required>
                                <option value="">-- Bitte auswählen --</option>
                                <option value="STROM">STROM</option>
                                <option value="WASSER">WASSER</option>
                                <option value="HEIZUNG">HEIZUNG</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="meterCount" class="form-label">Zählerstand</label>
                            <input type="number" id="meterCount" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="meterId" class="form-label">Zähler-ID</label>
                            <input type="text" id="meterId" class="form-control" readonly />
                        </div>
                        <div class="mb-3">
                            <label for="substitute" class="form-label">Substitute</label>
                            <input type="number" id="substitute" class="form-control" value="0" />
                        </div>

                        <!-- Kommentar -->
                        <div class="mb-3">
                            <label for="comment" class="form-label">Kommentar</label>
                            <textarea id="comment" class="form-control"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-primary" id="saveReadingBtn">Speichern</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/reading.js"></script>
<script src="../js/pages.js"></script>

<script>
    // Zeige/Verstecke Felder "Neuer Kunde", wenn ein bestehender Kunde gewählt wird.
    const customerSelect = document.getElementById("customerSelect");
    const newCustomerFields = document.getElementById("newCustomerFields");

    customerSelect.addEventListener("change", () => {
      if (customerSelect.value) {
        newCustomerFields.classList.add("d-none");
      } else {
        newCustomerFields.classList.remove("d-none");
      }
    });
</script>

</body>
</html>
