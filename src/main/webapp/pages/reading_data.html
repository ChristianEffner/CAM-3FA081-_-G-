<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>HausFix – Ablesedaten Diagramm</title>
    <meta name="viewport" content="width=device-width, initial‐scale=1" />

    <!-- Bootstrap & Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
    />
    <!-- App‐CSS -->
    <link rel="stylesheet" href="../css/pages.css" />

    <style>
        /* Tabelle & Chart auf volle Breite */
        .fixed-table { table-layout: fixed; width: 100%; }
        .fixed-table thead th:nth-child(1) { width: 15%; }
        .fixed-table thead th:nth-child(2) { width: 20%; }
        .fixed-table thead th:nth-child(3) { width: 20%; }
        .fixed-table thead th:nth-child(4) { width: 15%; }
        .fixed-table thead th:nth-child(5) { width: 10%; }
        .fixed-table thead th:nth-child(6) { width: 20%; }

        .short-id-col {
          max-width: 150px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .short-id-col[data-bs-toggle="tooltip"] {
          cursor: help;
          text-decoration: underline dotted;
        }

        .chart-container {
          position: relative;
          height: 300px;
          margin: 0 auto 2rem;
          max-width: 800px;
        }
    </style>
</head>
<body>
<div id="sidebar">
    <h2>HausFix</h2>
    <ul class="nav">
        <li class="nav-item">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Startseite</a>
        </li>
        <li class="nav-item">
            <a href="customers.html" class="nav-link"><i class="fas fa-users"></i> Kunden</a>
        </li>
        <li class="nav-item">
            <a href="reading.html" class="nav-link"><i class="fas fa-book"></i> Reading</a>
        </li>
        <li class="nav-item">
            <a href="importexport.html" class="nav-link"><i class="fas fa-file-import"></i> Import/Export</a>
        </li>
        <li class="nav-item">
            <a href="logout.html" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </li>
    </ul>
</div>

<div id="content">
    <header>
        <h1>Ablesedaten Diagramm</h1>
        <p>Hier siehst du die Ablesewerte als Liniendiagramm. Filtere bei Bedarf neu.</p>
    </header>

    <section class="mb-4 text-center">
        <button
                class="btn btn-secondary"
                data-bs-toggle="modal"
                data-bs-target="#advFilterModal"
        >
            <i class="fas fa-filter"></i> Filter anpassen
        </button>
    </section>

    <section>
        <div class="chart-container mb-5">
            <canvas id="lineChart"></canvas>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover fixed-table">
                <thead class="bg-primary text-white">
                <tr>
                    <th class="short-id-col">ID</th>
                    <th>Kunde</th>
                    <th>Datum</th>
                    <th>Zählertyp</th>
                    <th>Zählerstand</th>
                    <th>Kommentar</th>
                </tr>
                </thead>
                <tbody id="readingDataTableBody">
                <!-- gefüllt durch reading_data.js -->
                </tbody>
            </table>
        </div>
    </section>
</div>

<!-- Modal: Erweiterter Filter -->
<div
        class="modal fade"
        id="advFilterModal"
        tabindex="-1"
        aria-labelledby="advFilterLabel"
        aria-hidden="true"
>
    <div class="modal-dialog">
        <form id="advFilterForm" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="advFilterLabel">Erweiterter Filter</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Zählertyp</label>
                    <select id="fKind" class="form-select">
                        <option value="">Alle</option>
                        <option value="STROM">STROM</option>
                        <option value="WASSER">WASSER</option>
                        <option value="HEIZUNG">HEIZUNG</option>
                        <option value="UNBEKANNT">UNBEKANNT</option>
                    </select>
                </div>
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Von</label>
                        <input id="fStart" type="date" class="form-control" />
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Bis</label>
                        <input id="fEnd" type="date" class="form-control" />
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                        id="resetFilter"
                        type="button"
                        class="btn btn-outline-secondary"
                >
                    Zurücksetzen
                </button>
                <button type="submit" class="btn btn-primary">Anwenden</button>
            </div>
        </form>
    </div>
</div>

<!-- Libs -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<!-- App -->
<script src="../js/reading_data.js"></script>
<script src="../js/pages.js"></script>

<!-- MutationObserver: ID‐Kürzen + Datum formatieren -->
<script>
    (function () {
      const tbody = document.getElementById("readingDataTableBody");
      function processRows() {
        tbody.querySelectorAll("tr").forEach((row) => {
          const cells = row.querySelectorAll("td");
          if (cells.length < 5) return;
          // ID kürzen
          const idCell = cells[0],
            full = idCell.textContent.trim();
          if (full.length > 8) {
            idCell.textContent = full.substring(0, 8);
            idCell.setAttribute("data-bs-toggle", "tooltip");
            idCell.setAttribute("data-bs-placement", "top");
            idCell.setAttribute("data-bs-title", full);
          }
          // Datum formatieren yyyy-mm-dd → dd.mm.yyyy
          const dateCell = cells[2],
            iso = dateCell.textContent.trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
            const [y, m, d] = iso.split("-");
            dateCell.textContent = `${d}.${m}.${y}`;
          }
        });
        [...tbody.querySelectorAll('[data-bs-toggle="tooltip"]')].forEach(
          (el) => new bootstrap.Tooltip(el)
        );
      }
      new MutationObserver(processRows).observe(tbody, {
        childList: true,
        subtree: true,
      });
    })();
</script>
</body>
</html>
