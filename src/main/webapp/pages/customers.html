<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>HausFix - Kunden</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/pages.css" />

    <style>
        /* Damit die Tabelle fix auf 100% ist, mit fester Spaltenbreite */
        .fixed-table {
          table-layout: fixed; /* WICHTIG: feste Spaltenbreiten */
          width: 100%;
        }
        /* Jede Spalte kriegt eine ungefähre Breite (für 6 Spalten) */
        .fixed-table thead th:nth-child(1) { width: 15%; } /* ID */
        .fixed-table thead th:nth-child(2) { width: 15%; } /* Vorname */
        .fixed-table thead th:nth-child(3) { width: 15%; } /* Nachname */
        .fixed-table thead th:nth-child(4) { width: 20%; } /* Geburtsdatum */
        .fixed-table thead th:nth-child(5) { width: 10%; } /* Geschlecht */
        .fixed-table thead th:nth-child(6) { width: 25%; } /* Aktionen */

        /* Spalte für ID auf max 150px, abgeschnitten/gekürzt */
        .short-id-col {
          max-width: 150px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Cursor und Text-Deko für Tooltip */
        .short-id-col[data-bs-toggle="tooltip"] {
          cursor: help;
          text-decoration: underline dotted;
        }
    </style>
</head>
<body>
<div id="sidebar">
    <h2>HausFix</h2>
    <ul class="nav">
        <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
                <i class="fas fa-home"></i> Startseite
            </a>
        </li>
        <li class="nav-item">
            <a href="customers.html" class="nav-link active">
                <i class="fas fa-users"></i> Kunden
            </a>
        </li>
        <li class="nav-item">
            <a href="reading.html" class="nav-link">
                <i class="fas fa-book"></i> Reading
            </a>
        </li>
        <li class="nav-item">
            <a href="importexport.html" class="nav-link">
                <i class="fas fa-file-import"></i> Import/Export
            </a>
        </li>
        <li class="nav-item">
            <a href="logout.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </li>
    </ul>
</div>

<div id="content">
    <header>
        <h1>Kundenverwaltung</h1>
        <p>Übersicht und Verwaltung aller Kunden.</p>
    </header>

    <section>
        <!-- Button + Suchfeld -->
        <div class="d-flex justify-content-between mb-4">
            <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addCustomerModal"
            >
                <i class="fas fa-user-plus"></i> Neuen Kunden hinzufügen
            </button>
            <div class="input-group w-50">
                <input
                        type="text"
                        id="searchCustomer"
                        class="form-control"
                        placeholder="Nach Name oder ID suchen..."
                />
                <button class="btn btn-secondary" type="button">
                    Filter anwenden
                </button>
            </div>
        </div>

        <!-- Tabelle in .table-responsive + .fixed-table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover fixed-table" id="customerTable">
                <thead class="bg-primary text-white">
                <tr>
                    <th class="short-id-col">ID</th>
                    <th>Vorname</th>
                    <th>Nachname</th>
                    <th>Geburtsdatum</th>
                    <th>Geschlecht</th>
                    <th>Aktionen</th>
                </tr>
                </thead>
                <tbody id="customerTableBody">
                <!-- Befüllt durch customers.js -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Modal: Neuer Kunde -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1" aria-labelledby="addCustomerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCustomerModalLabel">Neuer Kunde</h5>
                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Schließen"
                    ></button>
                </div>
                <div class="modal-body">
                    <form id="addCustomerForm">
                        <div class="mb-3">
                            <label for="userId" class="form-label">User ID</label>
                            <input type="text" id="userId" class="form-control" readonly />
                        </div>
                        <div class="mb-3">
                            <label for="firstName" class="form-label">Vorname</label>
                            <input type="text" id="firstName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="lastName" class="form-label">Nachname</label>
                            <input type="text" id="lastName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="birthDate" class="form-label">Geburtsdatum</label>
                            <input type="date" id="birthDate" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="gender" class="form-label">Geschlecht</label>
                            <select id="gender" class="form-control">
                                <option value="M">Männlich</option>
                                <option value="W">Weiblich</option>
                                <option value="D">Divers</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        Abbrechen
                    </button>
                    <button type="button" class="btn btn-primary" id="saveCustomerBtn">
                        Speichern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Kunde bearbeiten -->
    <div class="modal fade" id="editCustomerModal" tabindex="-1" aria-labelledby="editCustomerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCustomerModalLabel">Kunde bearbeiten</h5>
                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Schließen"
                    ></button>
                </div>
                <div class="modal-body">
                    <form id="editCustomerForm">
                        <input type="hidden" id="editCustomerId" />
                        <div class="mb-3">
                            <label for="editCustomerFirstName" class="form-label">Vorname</label>
                            <input type="text" id="editCustomerFirstName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editCustomerLastName" class="form-label">Nachname</label>
                            <input type="text" id="editCustomerLastName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editCustomerBirthDate" class="form-label">Geburtsdatum</label>
                            <input type="date" id="editCustomerBirthDate" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editCustomerGender" class="form-label">Geschlecht</label>
                            <select id="editCustomerGender" class="form-control">
                                <option value="M">Männlich</option>
                                <option value="W">Weiblich</option>
                                <option value="D">Divers</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        Abbrechen
                    </button>
                    <button type="button" class="btn btn-primary" id="updateCustomerBtn">
                        Speichern
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/customers.js"></script>
<script src="../js/pages.js"></script>

<script>
    // Beim Öffnen des "Neuer Kunde" Modals -> userId-Feld füllen
    const addModalEl = document.getElementById("addCustomerModal");
    addModalEl.addEventListener("show.bs.modal", () => {
      const loggedUserId = localStorage.getItem("userId") || "";
      document.getElementById("userId").value = loggedUserId;
    });

    // UUID + Datum per MutationObserver kürzen
    (function() {
      const tableBody = document.getElementById("customerTableBody");

      function processRows() {
        tableBody.querySelectorAll("tr").forEach(row => {
          const cells = row.querySelectorAll("td");
          if (cells.length < 5) return;
          // [0]=ID, [1]=Vorname, [2]=Nachname, [3]=Geburtsdatum, [4]=Geschlecht

          // 1) ID kürzen + Tooltip
          const idCell = cells[0];
          const fullID = idCell.textContent.trim();
          if (fullID.length > 8) {
            idCell.textContent = fullID.substring(0, 8);
            idCell.setAttribute("data-bs-toggle", "tooltip");
            idCell.setAttribute("data-bs-placement", "top");
            idCell.setAttribute("data-bs-title", fullID);
          }

          // 2) GebDatum formatieren yyyy-mm-dd -> dd.mm.yyyy
          const dateCell = cells[3];
          const isoDate = dateCell.textContent.trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) {
            const [yyyy, mm, dd] = isoDate.split("-");
            dateCell.textContent = `${dd}.${mm}.${yyyy}`;
          }
        });

        // Tooltips initialisieren
        const tooltipList = [].slice.call(
          tableBody.querySelectorAll('[data-bs-toggle="tooltip"]')
        );
        tooltipList.forEach(el => {
          new bootstrap.Tooltip(el);
        });
      }

      const observer = new MutationObserver(processRows);
      observer.observe(tableBody, { childList: true, subtree: true });
    })();
</script>
</body>
</html>
